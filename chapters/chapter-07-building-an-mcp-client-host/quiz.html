  <span class="chapter-badge">Chapter 7 Quiz</span>
  <h1>Building an MCP Client/Host</h1>
  <p>Five questions. Fill in the blank, then check your answers.</p>

  <div class="quiz-progress-wrap" aria-hidden="true">
    <div class="quiz-progress-fill" id="quiz-progress-fill"></div>
  </div>

  <form onsubmit="return false;">
    <div class="quiz-question">
      <label for="q1"><span class="q-num">1</span> A host's two jobs are __________ what a server offers, and deciding-then-invoking.</label>
      <div class="fib-row">
        <input type="text" id="q1" class="fib-blank" data-answers="discover,discovering" aria-label="Answer for question 1">
        <button type="button" class="check-btn">Check</button>
        <span class="fib-feedback" aria-live="polite"></span>
      </div>
    </div>

    <div class="quiz-question">
      <label for="q2"><span class="q-num">2</span> The SDK's Client class is not a host -- it's the protocol __________ Chapter 2 described.</label>
      <div class="fib-row">
        <input type="text" id="q2" class="fib-blank" data-answers="connection" aria-label="Answer for question 2">
        <button type="button" class="check-btn">Check</button>
        <span class="fib-feedback" aria-live="polite"></span>
      </div>
    </div>

    <div class="quiz-question">
      <label for="q3"><span class="q-num">3</span> Host code must always check <code>result.__________</code> after a tool call, per this course's most repeated production bug pattern.</label>
      <div class="fib-row">
        <input type="text" id="q3" class="fib-blank" data-answers="is_error" aria-label="Answer for question 3">
        <button type="button" class="check-btn">Check</button>
        <span class="fib-feedback" aria-live="polite"></span>
      </div>
    </div>

    <div class="quiz-question">
      <label for="q4"><span class="q-num">4</span> Swapping keyword-matching for a real LLM changes only the __________ step of a host's loop.</label>
      <div class="fib-row">
        <input type="text" id="q4" class="fib-blank" data-answers="decide,decision" aria-label="Answer for question 4">
        <button type="button" class="check-btn">Check</button>
        <span class="fib-feedback" aria-live="polite"></span>
      </div>
    </div>

    <div class="quiz-question">
      <label for="q5"><span class="q-num">5</span> In the production scenario, a host that skipped the is_error check reported a hallucinated tool call as a __________ instead of a clear error.</label>
      <div class="fib-row">
        <input type="text" id="q5" class="fib-blank" data-answers="success" aria-label="Answer for question 5">
        <button type="button" class="check-btn">Check</button>
        <span class="fib-feedback" aria-live="polite"></span>
      </div>
    </div>

    <div id="check-all-wrap">
      <button type="button" id="check-all-btn" class="check-btn">Check All Answers</button>
      <span id="quiz-score"></span>
    </div>

    <div class="quiz-celebration" id="quiz-celebration" aria-live="polite">
      Perfect score. Chapter complete.
    </div>
  </form>
