  <span class="chapter-badge">Chapter 9 Quiz</span>
  <h1>Permissions, Scopes & Sandboxing</h1>
  <p>Five questions. Fill in the blank, then check your answers.</p>

  <div class="quiz-progress-wrap" aria-hidden="true">
    <div class="quiz-progress-fill" id="quiz-progress-fill"></div>
  </div>

  <form onsubmit="return false;">
    <div class="quiz-question">
      <label for="q1"><span class="q-num">1</span> MCP itself defines __________ permission model -- every scope-checking pattern in this chapter is application code.</label>
      <div class="fib-row">
        <input type="text" id="q1" class="fib-blank" data-answers="no" aria-label="Answer for question 1">
        <button type="button" class="check-btn">Check</button>
        <span class="fib-feedback" aria-live="polite"></span>
      </div>
    </div>

    <div class="quiz-question">
      <label for="q2"><span class="q-num">2</span> A PermissionError raised inside a tool surfaces as a normal result with __________ set to True, same as any other tool failure.</label>
      <div class="fib-row">
        <input type="text" id="q2" class="fib-blank" data-answers="is_error" aria-label="Answer for question 2">
        <button type="button" class="check-btn">Check</button>
        <span class="fib-feedback" aria-live="polite"></span>
      </div>
    </div>

    <div class="quiz-question">
      <label for="q3"><span class="q-num">3</span> Scopes control who can call what; __________ controls what a tool can reach once it's called.</label>
      <div class="fib-row">
        <input type="text" id="q3" class="fib-blank" data-answers="sandboxing" aria-label="Answer for question 3">
        <button type="button" class="check-btn">Check</button>
        <span class="fib-feedback" aria-live="polite"></span>
      </div>
    </div>

    <div class="quiz-question">
      <label for="q4"><span class="q-num">4</span> In the production scenario, the fix was enforcing read-only access at the __________ level (database credentials), not just in the tool's own code.</label>
      <div class="fib-row">
        <input type="text" id="q4" class="fib-blank" data-answers="infrastructure" aria-label="Answer for question 4">
        <button type="button" class="check-btn">Check</button>
        <span class="fib-feedback" aria-live="polite"></span>
      </div>
    </div>

    <div class="quiz-question">
      <label for="q5"><span class="q-num">5</span> A caller's granted scope must come from verified __________, not an unverified caller-supplied claim.</label>
      <div class="fib-row">
        <input type="text" id="q5" class="fib-blank" data-answers="authentication,identity" aria-label="Answer for question 5">
        <button type="button" class="check-btn">Check</button>
        <span class="fib-feedback" aria-live="polite"></span>
      </div>
    </div>

    <div id="check-all-wrap">
      <button type="button" id="check-all-btn" class="check-btn">Check All Answers</button>
      <span id="quiz-score"></span>
    </div>

    <div class="quiz-celebration" id="quiz-celebration" aria-live="polite">
      Perfect score. Chapter complete.
    </div>
  </form>
