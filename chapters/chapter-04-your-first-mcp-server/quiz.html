  <span class="chapter-badge">Chapter 4 Quiz</span>
  <h1>Your First MCP Server</h1>
  <p>Six questions. Fill in the blank, then check your answers.</p>

  <div class="quiz-progress-wrap" aria-hidden="true">
    <div class="quiz-progress-fill" id="quiz-progress-fill"></div>
  </div>

  <form onsubmit="return false;">
    <div class="quiz-question">
      <label for="q1"><span class="q-num">1</span> A function the model can call to cause a side effect (like saving a note) is called a __________.</label>
      <div class="fib-row">
        <input type="text" id="q1" class="fib-blank" data-answers="tool" aria-label="Answer for question 1">
        <button type="button" class="check-btn">Check</button>
        <span class="fib-feedback" aria-live="polite"></span>
      </div>
    </div>

    <div class="quiz-question">
      <label for="q2"><span class="q-num">2</span> Readable data addressed by a URI, like <code>note://todo</code>, is exposed as a __________.</label>
      <div class="fib-row">
        <input type="text" id="q2" class="fib-blank" data-answers="resource" aria-label="Answer for question 2">
        <button type="button" class="check-btn">Check</button>
        <span class="fib-feedback" aria-live="polite"></span>
      </div>
    </div>

    <div class="quiz-question">
      <label for="q3"><span class="q-num">3</span> The Python SDK generates a tool's JSON Schema from its __________ hints and docstring.</label>
      <div class="fib-row">
        <input type="text" id="q3" class="fib-blank" data-answers="type" aria-label="Answer for question 3">
        <button type="button" class="check-btn">Check</button>
        <span class="fib-feedback" aria-live="polite"></span>
      </div>
    </div>

    <div class="quiz-question">
      <label for="q4"><span class="q-num">4</span> Under the 2026-07-28 spec, MCP requests are __________ — there is no session-scoped handshake.</label>
      <div class="fib-row">
        <input type="text" id="q4" class="fib-blank" data-answers="stateless" aria-label="Answer for question 4">
        <button type="button" class="check-btn">Check</button>
        <span class="fib-feedback" aria-live="polite"></span>
      </div>
    </div>

    <div class="quiz-question">
      <label for="q5"><span class="q-num">5</span> Servers built against the older 2025-11-25 spec expect an __________ handshake before any tool call.</label>
      <div class="fib-row">
        <input type="text" id="q5" class="fib-blank" data-answers="initialize" aria-label="Answer for question 5">
        <button type="button" class="check-btn">Check</button>
        <span class="fib-feedback" aria-live="polite"></span>
      </div>
    </div>

    <div class="quiz-question">
      <label for="q6"><span class="q-num">6</span> In the failure lab, removing a type hint from a tool parameter did NOT crash the server — it silently __________ the accepted input.</label>
      <div class="fib-row">
        <input type="text" id="q6" class="fib-blank" data-answers="widened,broadened" aria-label="Answer for question 6">
        <button type="button" class="check-btn">Check</button>
        <span class="fib-feedback" aria-live="polite"></span>
      </div>
    </div>

    <div id="check-all-wrap">
      <button type="button" id="check-all-btn" class="check-btn">Check All Answers</button>
      <span id="quiz-score"></span>
    </div>

    <div class="quiz-celebration" id="quiz-celebration" aria-live="polite">
      Perfect score. Chapter complete.
    </div>
  </form>
