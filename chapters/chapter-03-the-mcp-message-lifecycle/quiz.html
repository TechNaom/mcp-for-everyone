  <span class="chapter-badge">Chapter 3 Quiz</span>
  <h1>The MCP Message Lifecycle</h1>
  <p>Six questions. Fill in the blank, then check your answers.</p>

  <div class="quiz-progress-wrap" aria-hidden="true">
    <div class="quiz-progress-fill" id="quiz-progress-fill"></div>
  </div>

  <form onsubmit="return false;">
    <div class="quiz-question">
      <label for="q1"><span class="q-num">1</span> Every JSON-RPC result response includes a __________ field indicating "complete" or "input_required".</label>
      <div class="fib-row">
        <input type="text" id="q1" class="fib-blank" data-answers="resultType" aria-label="Answer for question 1">
        <button type="button" class="check-btn">Check</button>
        <span class="fib-feedback" aria-live="polite"></span>
      </div>
    </div>

    <div class="quiz-question">
      <label for="q2"><span class="q-num">2</span> Protocol version and client capabilities travel in every request's __________ field, not in a one-time handshake.</label>
      <div class="fib-row">
        <input type="text" id="q2" class="fib-blank" data-answers="_meta,meta" aria-label="Answer for question 2">
        <button type="button" class="check-btn">Check</button>
        <span class="fib-feedback" aria-live="polite"></span>
      </div>
    </div>

    <div class="quiz-question">
      <label for="q3"><span class="q-num">3</span> A JSON-RPC __________ is a one-way message with no id and no expected reply.</label>
      <div class="fib-row">
        <input type="text" id="q3" class="fib-blank" data-answers="notification" aria-label="Answer for question 3">
        <button type="button" class="check-btn">Check</button>
        <span class="fib-feedback" aria-live="polite"></span>
      </div>
    </div>

    <div class="quiz-question">
      <label for="q4"><span class="q-num">4</span> Per the spec, an open stdio connection must NOT be treated as a __________ — servers can't infer context between requests on it.</label>
      <div class="fib-row">
        <input type="text" id="q4" class="fib-blank" data-answers="conversation,session" aria-label="Answer for question 4">
        <button type="button" class="check-btn">Check</button>
        <span class="fib-feedback" aria-live="polite"></span>
      </div>
    </div>

    <div class="quiz-question">
      <label for="q5"><span class="q-num">5</span> Per the compatibility matrix, a modern client talking to a __________ server fails, sometimes silently.</label>
      <div class="fib-row">
        <input type="text" id="q5" class="fib-blank" data-answers="legacy" aria-label="Answer for question 5">
        <button type="button" class="check-btn">Check</button>
        <span class="fib-feedback" aria-live="polite"></span>
      </div>
    </div>

    <div class="quiz-question">
      <label for="q6"><span class="q-num">6</span> <code>clientInfo</code> and <code>serverInfo</code> are self-reported and must never be used for __________ decisions.</label>
      <div class="fib-row">
        <input type="text" id="q6" class="fib-blank" data-answers="security" aria-label="Answer for question 6">
        <button type="button" class="check-btn">Check</button>
        <span class="fib-feedback" aria-live="polite"></span>
      </div>
    </div>

    <div id="check-all-wrap">
      <button type="button" id="check-all-btn" class="check-btn">Check All Answers</button>
      <span id="quiz-score"></span>
    </div>

    <div class="quiz-celebration" id="quiz-celebration" aria-live="polite">
      Perfect score. Chapter complete.
    </div>
  </form>
