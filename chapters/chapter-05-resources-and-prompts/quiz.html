  <span class="chapter-badge">Chapter 5 Quiz</span>
  <h1>Resources & Prompts</h1>
  <p>Five questions. Fill in the blank, then check your answers.</p>

  <div class="quiz-progress-wrap" aria-hidden="true">
    <div class="quiz-progress-fill" id="quiz-progress-fill"></div>
  </div>

  <form onsubmit="return false;">
    <div class="quiz-question">
      <label for="q1"><span class="q-num">1</span> A resource with a fixed URI and no parameters is called a __________ resource.</label>
      <div class="fib-row">
        <input type="text" id="q1" class="fib-blank" data-answers="static" aria-label="Answer for question 1">
        <button type="button" class="check-btn">Check</button>
        <span class="fib-feedback" aria-live="polite"></span>
      </div>
    </div>

    <div class="quiz-question">
      <label for="q2"><span class="q-num">2</span> Templated resources are discovered via <code>client.list_resource_</code>__________<code>()</code>, a separate call from <code>list_resources()</code>.</label>
      <div class="fib-row">
        <input type="text" id="q2" class="fib-blank" data-answers="templates" aria-label="Answer for question 2">
        <button type="button" class="check-btn">Check</button>
        <span class="fib-feedback" aria-live="polite"></span>
      </div>
    </div>

    <div class="quiz-question">
      <label for="q3"><span class="q-num">3</span> Calling a prompt does not execute anything -- it returns a structured __________ for the host to send to the model.</label>
      <div class="fib-row">
        <input type="text" id="q3" class="fib-blank" data-answers="message" aria-label="Answer for question 3">
        <button type="button" class="check-btn">Check</button>
        <span class="fib-feedback" aria-live="polite"></span>
      </div>
    </div>

    <div class="quiz-question">
      <label for="q4"><span class="q-num">4</span> Unlike a tool, a prompt is meant to be explicitly chosen by a __________, not autonomously invoked by the model.</label>
      <div class="fib-row">
        <input type="text" id="q4" class="fib-blank" data-answers="person,user,human" aria-label="Answer for question 4">
        <button type="button" class="check-btn">Check</button>
        <span class="fib-feedback" aria-live="polite"></span>
      </div>
    </div>

    <div class="quiz-question">
      <label for="q5"><span class="q-num">5</span> In the production scenario, the policy resources were fully functional but invisible because the host never called list_resource___________.</label>
      <div class="fib-row">
        <input type="text" id="q5" class="fib-blank" data-answers="templates" aria-label="Answer for question 5">
        <button type="button" class="check-btn">Check</button>
        <span class="fib-feedback" aria-live="polite"></span>
      </div>
    </div>

    <div id="check-all-wrap">
      <button type="button" id="check-all-btn" class="check-btn">Check All Answers</button>
      <span id="quiz-score"></span>
    </div>

    <div class="quiz-celebration" id="quiz-celebration" aria-live="polite">
      Perfect score. Chapter complete.
    </div>
  </form>
